name: Publish to PyPI

# Triggered when a version tag is pushed (e.g. v0.2.0), or dispatched for a tag.
# The Release workflow dispatches this explicitly: tags it pushes with the
# repository token do not fire push-triggered workflows.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tag || github.ref }}
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - run: pip install -e .
    - run: |
        python -c "
        from sdr_mcp.server import SDRMCPServer
        server = SDRMCPServer()
        assert server.server.name == 'sdr-mcp'
        print('Sanity check passed')
        "

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tag || github.ref }}

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install build tools
      run: pip install build

    - name: Verify version matches tag
      env:
        TAG_INPUT: ${{ inputs.tag }}
      run: |
        TAG="${TAG_INPUT:-${GITHUB_REF#refs/tags/}}"
        TAG="${TAG#v}"
        PKG_VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        INIT_VER=$(python -c "exec(open('sdr_mcp/__init__.py').read()); print(__version__)")
        echo "Tag: $TAG | pyproject.toml: $PKG_VER | __init__.py: $INIT_VER"
        if [ "$TAG" != "$PKG_VER" ] || [ "$TAG" != "$INIT_VER" ]; then
          echo "ERROR: Version mismatch! Update pyproject.toml and __init__.py to match tag."
          exit 1
        fi

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
