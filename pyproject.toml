[project]
name = "aetherlink"
version = "0.1.3"
description = "MCP server for Software Defined Radio — control RTL-SDR & HackRF from Claude"
authors = [{name = "N-Erickson"}]
license = {text = "MIT"}
readme = "readme.md"
requires-python = ">=3.10"
keywords = [
    "sdr", "rtl-sdr", "hackrf", "radio",
    "mcp", "model-context-protocol", "claude",
    "adsb", "ais", "pocsag", "satellite",
    "spectrum-analysis", "signal-processing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # The MCP Python SDK 2.x removed the low-level Server decorators this server
    # is built on (list_tools/call_tool/...). Stay on 1.x until the port lands.
    "mcp>=1.23.0,<2",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    # pyrtlsdr 0.4+ binds rtlsdr_set_dithering at import, which the stock Osmocom
    # librtlsdr (e.g. Homebrew 2.0.2) does not export, so RTL-SDR support would fail
    # to load on those systems. Stay on 0.3.x and shim its pkg_resources import.
    "pyrtlsdr>=0.3.0,<0.4",
    "sgp4>=2.22",        # satellite pass prediction
    "pyModeS>=2.19",     # ADS-B decoding
    "pyais>=2.5.0",      # AIS decoding
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/N-Erickson/AetherLink-SDR-MCP"
Documentation = "https://github.com/N-Erickson/AetherLink-SDR-MCP#readme"
Repository = "https://github.com/N-Erickson/AetherLink-SDR-MCP"
Issues = "https://github.com/N-Erickson/AetherLink-SDR-MCP/issues"

[project.scripts]
aetherlink = "sdr_mcp.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdr_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
